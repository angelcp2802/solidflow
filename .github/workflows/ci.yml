name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Fork pull requests run unprivileged code without repository secrets.
# Do not replace pull_request with pull_request_target or workflow_run.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }}-${{ matrix.arch }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    env:
      CI: "true"
      # CI artifacts have no signing credentials and are never published.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out the merge being tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Start from the lockfile without sharing caches across fork builds.
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Run portable unit and CAD tests
        run: npm run test:unit

      - name: Verify desktop IPC security
        run: npm run test:ipc

      - name: Install the Linux virtual display and Electron libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libasound2t64 libgbm1 libgtk-3-0t64 libnss3

      - name: Configure the Linux sandbox helper
        if: runner.os == 'Linux'
        # Electron downloads its binary on first require. Keep Chromium's
        # sandbox enabled by installing the helper's required owner and mode.
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c '%u:%g:%a' node_modules/electron/dist/chrome-sandbox)" = "0:0:4755"

      - name: Smoke test the production loader in Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:desktop

      - name: Smoke test the production loader in Electron (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop

      - name: Test explicit imported body persistence (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:desktop:imported-bodies

      - name: Test explicit imported body persistence (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop:imported-bodies

      - name: Test structural assembly STEP editor interchange (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:desktop:assembly-step

      - name: Test structural assembly STEP editor interchange (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop:assembly-step

      - name: Test structural STEP component insertion (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:desktop:assembly-step-insertion

      - name: Test structural STEP component insertion (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop:assembly-step-insertion

      - name: Test selected-to-ALL pattern interaction (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:desktop:pattern-all

      - name: Test selected-to-ALL pattern interaction (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop:pattern-all

      - name: Test explicit fixed-plane pattern choice (Linux)
        if: runner.os == 'Linux'
