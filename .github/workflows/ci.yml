name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Fork pull requests run unprivileged code without repository secrets.
# Do not replace pull_request with pull_request_target or workflow_run.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }}-${{ matrix.arch }}, Node 24)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
    env:
      CI: "true"
      # CI artifacts have no signing credentials and are never published.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out the merge being tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          # Start from the lockfile without sharing caches across fork builds.
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

      - name: Run portable unit and CAD tests
        run: npm run test:unit

      - name: Verify desktop IPC security
        run: npm run test:ipc

      - name: Install the Linux virtual display and Electron libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libasound2t64 libgbm1 libgtk-3-0t64 libnss3

      - name: Smoke test the production loader in Electron (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" npm run test:desktop

      - name: Smoke test the production loader in Electron (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop

      - name: Package for the current operating system
        # Build was already checked above. Use the local locked builder, with no
        # registry fallback, GitHub release upload, signing secret or notarizing.
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      # Validate packaging without distributing binaries until the full
      # corresponding-source bundle for the CAD toolchain is verified.
