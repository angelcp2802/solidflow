      - name: Test saved UntilNext regeneration (Windows/macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop:pattern-until-next

      - name: Test rigid assembly preview, Apply and persistence (Linux)
        if: runner.os == 'Linux'
