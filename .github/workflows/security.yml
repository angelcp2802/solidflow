name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit (high/critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the merge being tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Audit production and development dependencies
        # Uses the committed lockfile; no dependency lifecycle scripts execute.
        # High/critical findings block CI. Moderate findings stay visible and
        # actionable; no advisories, packages or development dependencies ignored.
        # Registry/network failure also fails this check.
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Check out the merge being tested
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze source and upload code scanning results
        # pull_request also permits CodeQL uploads from forks/Dependabot using
        # the restricted GitHub token; no personal token or secret is required.
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
